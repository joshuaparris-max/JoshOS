name: Build Josh OS Native Kernel

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'GNUmakefile'
      - 'limine.conf'
      - 'kernel/**'
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - 'GNUmakefile'
      - 'limine.conf'
      - 'kernel/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make xorriso qemu-system-x86 curl git

      - name: Host protocol tests
        run: make host-tests

      - name: Build ISO
        run: make

      - name: Boot smoke test
        run: make smoke

      - name: Keyboard IRQ smoke test
        run: make keyboard-smoke

      - name: Exception fault smoke test
        run: make fault-smoke

      - name: Ring 3 syscall smoke test
        run: make ring3-smoke

      - name: Record checksum
        run: sha256sum JoshOS-0.1-x86_64.iso | tee JoshOS-0.1-x86_64.iso.sha256

      - name: Upload bootable ISO
        uses: actions/upload-artifact@v4
        with:
          name: JoshOS-0.1-x86_64
          path: |
            JoshOS-0.1-x86_64.iso
            JoshOS-0.1-x86_64.iso.sha256
          if-no-files-found: error
