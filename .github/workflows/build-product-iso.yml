name: Build Josh OS Product ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-product-iso.yml'
      - 'design/**'
      - 'iso/**'
      - 'scripts/**'
      - 'shell/**'
      - 'tests/**'

permissions:
  contents: read

concurrency:
  group: josh-os-product-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Validate product scripts
        run: |
          bash -n scripts/build-iso.sh
          bash -n scripts/test-josh-audio.sh
          bash -n iso/overlay/usr/local/bin/josh-audio
          bash scripts/test-josh-audio.sh
          bash -n scripts/check-network-platform.sh
          bash -n scripts/check-product-browser.sh
          bash -n iso/overlay/usr/local/bin/josh-os-session
          bash -n iso/overlay/usr/local/bin/josh-os-browser
          bash -n iso/overlay/usr/local/bin/josh-os-browser-diagnostics
          bash -n iso/overlay/usr/local/bin/josh-youtube-acceptance
          bash -n iso/overlay/usr/local/bin/josh-network-check
          bash -n iso/overlay/usr/local/bin/josh-wifi
          bash -n iso/overlay/usr/local/bin/josh-network-acceptance
          python -m py_compile iso/overlay/usr/local/lib/josh-os/network-control.py
          python -m unittest tests/test_app_store_catalog.py
          node --check shell/apps.js
          python -m unittest discover -s iso/tests -p 'test_*.py'
          grep -q "/api/apps/catalog" shell/apps.js
          grep -q "/api/apps/launch" iso/overlay/usr/local/lib/josh-os/network-control.py
          grep -q "/api/network/status" shell/apps.js
          bash -n iso/overlay/usr/local/lib/josh-os/prepare-persistent-home
          bash -n iso/overlay/usr/local/lib/josh-os/browser-ready-probe
          bash -n iso/overlay/usr/local/lib/josh-os/browser-media-probe
          bash -n scripts/smoke-product-browser.sh

      - name: Build ISO in Arch Linux
        run: |
          docker run --rm --privileged \
            -v "$PWD:/work" \
            -w /work \
            archlinux:latest \
            bash -lc 'pacman -Syu --noconfirm archiso git && bash ./scripts/build-iso.sh'

      - name: Take ownership of build output
        run: sudo chown -R "$(id -u):$(id -g)" out

      - name: Product browser two-boot smoke test
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 e2fsprogs
          iso="$(ls -1 out/josh-os-*.iso | head -n1)"
          bash scripts/smoke-product-browser.sh "$iso" out/browser-persistence-test.img
          mv browser-boot-1.log out/browser-boot-1.log
          mv browser-boot-2.log out/browser-boot-2.log

      - name: Show ISO metadata
        run: |
          ls -lh out/*.iso
          sha256sum out/*.iso | tee out/SHA256SUMS

      - name: Upload bootable ISO
        uses: actions/upload-artifact@v4
        with:
          name: JoshOS-Stage0-Live-x86_64
          path: |
            out/*.iso
            out/SHA256SUMS
            out/browser-boot-1.log
            out/browser-boot-2.log
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
